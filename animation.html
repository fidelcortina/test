<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Animation</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f0f1a;
    }
  </style>
</head>
<body>
  <svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

    <!-- Rotating outer ring -->
    <circle cx="200" cy="200" r="160" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="20 10" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="12s" repeatCount="indefinite" />
    </circle>

    <!-- Counter-rotating middle ring -->
    <circle cx="200" cy="200" r="120" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="15 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360 200 200" to="0 200 200" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Pulsing inner circle -->
    <circle cx="200" cy="200" r="60" fill="#1e1b4b" stroke="#6366f1" stroke-width="2">
      <animate attributeName="r" values="60;70;60" dur="2s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting dot 1 -->
    <circle cx="200" cy="40" r="8" fill="#3b82f6">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting dot 2 -->
    <circle cx="200" cy="80" r="5" fill="#8b5cf6">
      <animateTransform attributeName="transform" type="rotate" from="180 200 200" to="540 200 200" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting dot 3 -->
    <circle cx="200" cy="100" r="4" fill="#a78bfa">
      <animateTransform attributeName="transform" type="rotate" from="90 200 200" to="450 200 200" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Center star burst -->
    <g transform="translate(200,200)">
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
      </line>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" />
      </line>
      <line x1="-21" y1="-21" x2="21" y2="21" stroke="#818cf8" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="6s" repeatCount="indefinite" />
      </line>
      <line x1="21" y1="-21" x2="-21" y2="21" stroke="#818cf8" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="6s" repeatCount="indefinite" />
      </line>
    </g>

    <!-- Glowing center dot -->
    <circle cx="200" cy="200" r="10" fill="#e0e7ff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>

  </svg>
</body>
</html>
